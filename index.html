<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5b21b6">
<meta name="description" content="Times table math game for kids and teens / Jogo de tabuada / Juego de tablas">

<title>Batalha da Tabuada</title>
<style>
:root{--card:#fff;--ink:#1e293b;--mute:#64748b;--line:#e2e8f0;--c1:#3b82f6;--c2:#f97316;--ok:#22c55e;--pri:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff}
#app{max-width:560px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:clamp(28px,8vw,42px);text-align:center;margin:4px 0 2px;line-height:1.05}
.sub{text-align:center;color:var(--mute);margin:0 0 12px;font-weight:700}
.card,.pill,.ic,.mode,.lv{border:2px solid var(--line)}
.card{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 6px 16px rgba(30,41,59,.10);margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--pri);outline-offset:2px}
.mascot{font-size:88px;text-align:center;line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.seg{display:flex;gap:6px;background:#f1f5f9;border-radius:99px;padding:4.5px;margin:0 auto 16px;max-width:340px}
.seg button{flex:1;min-height:43px;border-radius:99px;background:transparent;font-weight:900;font-size:17px}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border-radius:24px;padding:12px 8px;box-shadow:0 5px 0 rgba(0,0,0,.10);font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.mode .i{font-size:38px}.mode small{color:var(--mute);font-size:13px}
.mode.titan{background:linear-gradient(135deg,#fef08a,#fdba74);color:#422006;border-color:#fdba74}
.mode.titan small{color:#713f12}
.mini{position:relative;display:block;width:100%;height:30px;background:#e2e8f0;border-radius:99px;margin:6px 0 2px;overflow:hidden}
.mini b{position:absolute;left:0;top:0;bottom:0;background:#bbf7d0;border-radius:99px}
.mini .ln{position:absolute;left:3px;right:34px;top:0;bottom:0}
.mini i{position:absolute;top:0;font-style:normal;font-size:22px;line-height:30px}
.mini u{position:absolute;right:6px;top:0;text-decoration:none;font-size:20px;line-height:30px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pill{background:var(--card);border-radius:99px;padding:7px 12px;font-weight:800;font-size:15px}
.ic{background:var(--card);border-radius:99px;width:46px;height:46px;font-size:21px}
#cmb{margin-left:auto}
.scene h2{margin:0 0 4px;font-size:20px}.scene p{margin:0 0 8px;color:var(--mute);font-weight:700}
.track{position:relative;height:66px;background:linear-gradient(#bbf7d0,#86efac);border-radius:18px;overflow:hidden}
.lane{position:absolute;left:4px;right:62px;top:0;bottom:0}
.hero{position:absolute;top:6px;left:0;font-size:46px;line-height:54px;transition:left .6s,transform .6s}
.goal{position:absolute;right:8px;top:6px;font-size:42px;line-height:54px}
.hop{animation:hop .5s}.wig{animation:wig .5s}
@keyframes hop{40%{margin-top:-22px}}@keyframes wig{25%{margin-left:-8px}75%{margin-left:8px}}
.timer{position:relative;height:30px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:12px}
#tb{height:100%;width:100%;background:var(--ok);border-radius:99px;transition:background .3s}
#tn{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:18px;color:#0f172a}
.timer.urgent #tb{background:#ef4444}.timer.urgent{animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.enter{animation:enter .35s ease-out}.leave{animation:leave .2s ease-in forwards}
@keyframes enter{from{opacity:0;transform:translateX(40px)}}@keyframes leave{to{opacity:0;transform:translateX(-40px)}}
.qt{text-align:center;font-size:clamp(38px,12vw,56px);font-weight:900;letter-spacing:1px}
.vis{min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px 0 10px}
.eq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.eq>b{font-size:30px}
.bl{display:flex;flex-wrap:wrap;justify-content:center;max-width:300px}.bl.big{flex-direction:column;align-items:center}.bl.big>div{display:flex;flex-wrap:wrap;justify-content:center}
.b{display:inline-block;width:var(--s);height:var(--s);margin:1px;border-radius:3px;background:var(--c1);font-style:normal;font-size:11px;color:#fff;text-align:center;line-height:var(--s);font-weight:800}
.ten{width:calc(var(--s)*10 + 18px)}.c2{background:var(--c2)}
.grid{display:grid;justify-content:center}.cap{font-weight:800;color:var(--mute);font-size:15px;text-align:center}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grp{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;border:3px solid;border-radius:12px;padding:3px;max-width:116px}
.grp em{width:100%;text-align:center;font-style:normal;font-weight:900;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{min-height:78px;border-radius:22px;background:linear-gradient(#a78bfa,#8b5cf6);color:#fff;font-size:clamp(26px,8vw,36px);font-weight:900;box-shadow:0 6px 0 #6d28d9;transition:transform .1s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #6d28d9}
.opt:disabled{opacity:.92;cursor:default}
.opt.right{background:linear-gradient(#4ade80,#22c55e);box-shadow:0 6px 0 #15803d;animation:pop .4s}
.opt.oops{background:linear-gradient(#fbbf24,#f59e0b);box-shadow:0 6px 0 #b45309}
@keyframes pop{50%{transform:scale(1.12)}}
.fb{text-align:center;font-weight:900;font-size:21px;min-height:30px;margin-top:12px}
.fb small{display:block;font-size:16px;color:var(--mute);margin:2px 0}
.bar{position:sticky;bottom:12px;z-index:5}.bar:empty{display:none}
.btn{display:block;width:100%;min-height:60px;border-radius:20px;background:var(--pri);color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 #6d28d9;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15);border:2px solid var(--line)}
.btn.sh{background:#22c55e;box-shadow:0 5px 0 #15803d}
.res{text-align:center}.res h2{font-size:30px;margin:6px 0}
.stars{font-size:54px;letter-spacing:4px}.stars span{display:inline-block;animation:pop .6s both}
.stat{font-size:20px;font-weight:800;margin:6px 0}
.trail{position:relative;margin:4px 0 0;background:linear-gradient(#ecfeff,#f0fdf4);height:calc(100vh - 215px);height:calc(100dvh - 215px);min-height:380px;max-height:640px;padding:0}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--card);font-weight:900;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;border:2px solid var(--line)}
.node small{font-size:11px;min-height:12px}
.node.done{background:#bbf7d0;color:#14532d}.node.cur{background:#fde047;color:#422006;animation:pulse 1.2s infinite}
.node:disabled{background:#e2e8f0;color:#64748b;box-shadow:none}
.pet{position:absolute;transform:translate(-50%,-50%);font-size:36px;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
.goalp{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:900;width:200px}
.goalp b{display:block;font-size:50px;line-height:1}
.count{font-size:96px;font-weight:900;color:var(--pri);line-height:1.1;animation:pop 1s infinite}
.seg.age{max-width:400px;margin-bottom:8px}.seg.age button{font-size:14px;padding:0 4px}
.threat{position:absolute;left:6px;top:6px;font-size:38px;line-height:54px}.rad .lane{left:50px}.alarm .threat{animation:wig .3s infinite}
button.mascot{position:relative;display:grid;place-items:center;width:124px;height:124px;margin:0 auto;background:none;padding:0;border-radius:50%}
button.mascot.fast{border:4px solid #f59e0b;background:radial-gradient(#fef3c7,#fff);animation:bob 2s ease-in-out infinite,glow .9s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 4px rgba(245,158,11,.25),0 0 14px 4px rgba(245,158,11,.4)}to{box-shadow:0 0 0 8px rgba(245,158,11,.3),0 0 34px 12px rgba(245,158,11,.75)}}
.chg{position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--pri);font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.av{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.avb{font-size:42px;background:#fff;border:3px solid var(--line);border-radius:20px;min-height:76px}.avb.on{border-color:var(--pri);background:#ede9fe}
.btn.big{min-height:92px;font-size:28px;background:linear-gradient(#fb923c,#f97316);box-shadow:0 6px 0 #c2410c}
.flash{position:fixed;inset:0;background:#ef4444;pointer-events:none;z-index:20;opacity:0;animation:redblink .3s 3}
@keyframes redblink{50%{opacity:.55}}
.ten5{display:grid;grid-template-columns:repeat(5,auto);margin:3px;padding:2px;border:2px solid rgba(100,116,139,.35);border-radius:8px}.ten5.rest{border-style:dashed}
.typed{display:flex;gap:10px;align-items:center}
.typed input{flex:1;min-width:0;font:inherit;font-size:34px;font-weight:900;text-align:center;min-height:72px;border:4px solid var(--pri);border-radius:22px;color:var(--ink);background:#fff}
.typed input.okk{border-color:#22c55e;background:#dcfce7}.typed input.bad{border-color:#f59e0b;background:#fef3c7}
.typed .btn{width:92px;margin:0;min-height:72px;font-size:30px}
.hint{text-align:center;font-weight:800;color:#6d28d9;background:#f5f3ff;border-radius:14px;padding:8px 10px;margin:4px 0 6px;font-size:15px}
.tt{text-align:center;font-size:20px;margin:20px 0 8px}.modes.tr .mode{padding:10px 6px;font-size:16px}.modes.tr .mode .i{font-size:30px}
.compact{padding:10px 12px}
.compact .qt{font-size:34px}
.compact .vis{min-height:0;padding:2px 0;max-height:150px;overflow:auto}
.compact .typed input,.compact .typed .btn{min-height:60px;font-size:30px}
.compact .fb{margin-top:6px;min-height:24px;font-size:18px}
.tips{margin:0 0 6px;padding-left:20px;font-weight:700;line-height:1.45;font-size:16px}.tips li{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 18px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{margin-bottom:8px}.modes{margin-top:12px}
.notimer{background:#ecfdf5;color:#047857;border:2px solid #a7f3d0;border-radius:99px;padding:8px 14px;font-weight:800;text-align:center;margin-bottom:12px;font-size:14px}
.ad{display:block;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;text-decoration:none;color:#fff;font-weight:900;font-size:clamp(13px,4vw,17px);line-height:56px;height:56px;padding:0 46px 0 12px;border-radius:20px;background:linear-gradient(135deg,#fb923c,#f43f5e);box-shadow:0 5px 0 #be123c;margin-top:12px}
.ad::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.adtag{position:absolute;top:5px;right:8px;font-size:9px;line-height:1;background:rgba(0,0,0,.32);padding:3px 6px;border-radius:99px;font-weight:700;letter-spacing:.5px}

.tr4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{background:#fff;border:2px solid var(--line);border-radius:16px;min-height:58px;font-weight:800;font-size:12px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 2px}
.tbtn span{font-size:22px}.tbtn:active{transform:translateY(3px);box-shadow:none}
.adtile{position:relative;overflow:hidden;background:linear-gradient(135deg,#fb923c,#f43f5e);color:#fff;border-color:#fb923c;text-decoration:none}
.adtile .i{font-size:38px}.adshort{white-space:nowrap;font-size:14px}
.adtile::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
.ttable{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-weight:800;font-size:15px;text-align:center}
.ttable span{background:#f5f3ff;border-radius:10px;padding:5px 2px}
body{transition:background .6s}body.lost{background:#cfd8e3}
.topbar{display:flex;gap:14px;align-items:center;margin:-14px -14px 6px;padding:10px 14px;background:#5b21b6;color:#fff;box-shadow:0 0 0 100vmax #5b21b6;clip-path:inset(0 -100vmax)}
.lvl{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.1}
.lvbar{height:6px;background:rgba(255,255,255,.28);margin-top:4px;overflow:hidden}.lvbar i{display:block;height:100%;background:#fde047;transition:width .6s}
.langsel{background:transparent;color:#fff;border:0;font:inherit;font-weight:800;font-size:14px;padding:4px 0;cursor:pointer}.langsel option{color:#1e293b}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;color:#fff;font-size:10px;font-weight:800;line-height:1.1;padding:0}.tb span{font-size:20px;line-height:1}
.tt{margin:30px 0 12px}
.flip .hero .face{display:inline-block;transform:scaleX(-1)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal .box{background:#fff;border-radius:22px;padding:18px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.modal h2{margin:0 0 8px;font-size:20px}.modal p{margin:0 0 6px;font-weight:700;line-height:1.45}
</style>
</head>

,"tip_div_2":"Dividir entre 2 es hallar la mitad.","tip_div_5":"Dividir entre 5: el número termina en 0 o 5.","tip_div_9":"En la tabla del 9, los dígitos del resultado suman 9.","tip_div_group":"Dividir es repartir en grupos iguales: 12 ÷ 3 = 4 (12 cuadritos en 3 grupos de 4).","tip_div_mul":"Piensa en la multiplicación: ? × {N} = el número que vas a dividir.","tip_div_table":"Usa la tabla del {N}: {N} × 1, {N} × 2, {N} × 3...","level":"Nivel {n}","levelHint":"Completa {a} fases más para subir de nivel","shareApp":"Compartir","shareAppText":"🧮 Descubre la Batalla de las Tablas: un juego de cuentas con desafíos para niños y adolescentes.","battleHome":"⚔️ Modo batalla","tableTitle":"📋 Tabla del {n}: del 0 al 11","adShort":"Juegos educativos","opshort_add":"Suma","opshort_sub":"Resta","opshort_mul":"Multipl.","opshort_div":"División","addApp":"Guardar","close":"Cerrar","installTitle":"📲 Añadir a la pantalla de inicio","installIOS":"En iPhone/iPad: toca Compartir ⬆️ en Safari y luego «Añadir a pantalla de inicio».","installAndroid":"En Android: abre el menú ⋮ del navegador y toca «Añadir a la pantalla de inicio» (o «Instalar app»).","installDesktop":"En el ordenador: pulsa Ctrl+D (⌘+D en Mac) para añadir a favoritos."}</script>
<script>
/* ============ 0. IDIOMAS: textos em JSON (<script type="application/json" id="lang-xx"> no topo do HTML) ============ */
const LANGS=['pt','en','es'],LANG={};
function embedded(l){try{return JSON.parse(document.getElementById('lang-'+l).textContent)}catch(e){return{}}}
let CUR=null;
function detectLang(){ // 1) idioma salvo  2) idioma do navegador  3) inglês
  const s=SAVE.cfg&&SAVE.cfg.lang;if(LANGS.includes(s))return s;
  const n=((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase();
  return n.indexOf('pt')===0?'pt':n.indexOf('es')===0?'es':'en';
}
const lang=()=>CUR||(CUR=detectLang());
const raw=k=>{for(const l of [lang(),'en','pt']){const L=LANG[l];if(L&&k in L)return L[k]}return k};
const fmt=(s,v)=>typeof s==='string'&&v?s.replace(/\{(\w+)\}/g,(m,x)=>x in v?v[x]:m):s;
const t=(k,v)=>fmt(raw(k),v);                                   // t('chave',{var:valor})
const tl=(k,v)=>{const a=raw(k);return Array.isArray(a)?a.map(x=>fmt(x,v)):[]}; // listas
const nameOf=e=>(raw('names')||{})[e]||'';
function setLangDom(){document.documentElement.lang={pt:'pt-BR',en:'en',es:'es'}[lang()];document.title=t('title')}

/* ============ 1. CONFIGURAÇÃO ============ */
const QPL=10, PASS=6, PREP=5;                 // contas por fase / acertos para liberar a próxima / segundos antes da batalha
const TRAIN_PREP=20;                          // segundos para ler as dicas do treino ("Mais 10 segundos" soma mais)
const TYPE_FROM=6, TYPE_BONUS=3;              // a partir desta pergunta (1–10) a resposta é digitada; +3 s para digitar
const FLIP_HERO=true;                         // vira o herói para olhar na direção do destino (ameaça fica atrás, à esquerda)
const LEVEL_EVERY=5;                          // fases concluídas para subir 1 nível (barra do topo)
const TIMEOUT_LOSES=true;                     // tempo esgotado = derrota imediata
const R=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const TIMES=[15,14,13,12,11,10,9,8,7,6];      // segundos por pergunta (fase 1..10)
const FAST_FACTOR=.6, FAST_MIN=4, MIN_TIME=5; // modo rápido: tempo × 0.6; nas voltas extras o tempo cai 1 s por volta
const MUSIC_FAST=1.5;                         // andamento da música no modo Rápido
const AD_HOME='https://s.shopee.com.br/30oWnHsUsx', AD_WIN='https://s.shopee.com.br/3g4DaY2Lo0'; // links de publicidade
const MODES=[
  {id:'add',icon:'➕',ops:['add']},{id:'sub',icon:'➖',ops:['sub']},{id:'mul',icon:'✖️',ops:['mul']},{id:'div',icon:'➗',ops:['div']},
  {id:'as',icon:'🔄',ops:['add','sub']},{id:'am',icon:'🎯',ops:['add','mul']},{id:'sd',icon:'🎲',ops:['sub','div']},{id:'md',icon:'🔀',ops:['mul','div']},
  {id:'titan',icon:'👑',ops:['add','sub','mul','div'],times:[14,13,12,11,10,9,8,7,6,6]}
];
const META={ // animal e destino de cada trilha (os nomes dos destinos estão em place_* nos JSON)
  add:{animal:'🐰',goal:'🏡'},sub:{animal:'🐸',goal:'🏞️'},mul:{animal:'🐵',goal:'🏝️'},div:{animal:'🐻',goal:'🍯'},
  as:{animal:'🐶',goal:'🦴'},am:{animal:'🦊',goal:'💎'},sd:{animal:'🐧',goal:'🐟'},md:{animal:'🐼',goal:'⛰️'},titan:{animal:'🦁',goal:'👑'}
};

/* ============ 2. DIFICULDADE DAS FASES (edite aqui) ============ */
const OPS={
  add:[[1,5],[2,9],[5,12],[8,20],[10,30],[15,45],[20,60],[25,75],[30,90],[40,99]].map(([lo,hi])=>({lo,hi})),
  sub:[[3,8],[5,12],[8,18],[10,25],[15,40],[20,55],[30,70],[40,85],[50,99],[60,150]].map(([lo,hi])=>({lo,hi})),
  mul:[{t:[2,5,10],f:[2,5]},{t:R(2,5),f:[2,6]},{t:R(2,5),f:[2,8]},{t:R(2,6),f:[2,9]},{t:R(2,7),f:[2,10]},
       {t:R(3,8),f:[2,10]},{t:R(2,9),f:[3,10]},{t:R(2,10),f:[3,10]},{t:R(6,10),f:[4,10]},{t:R(2,10),f:[6,12]}],
  div:[{d:[2,5,10],q:[2,5]},{d:R(2,5),q:[2,6]},{d:R(2,5),q:[2,8]},{d:R(2,6),q:[2,9]},{d:R(2,7),q:[3,10]},
       {d:R(3,8),q:[3,10]},{d:R(2,9),q:[4,10]},{d:R(2,10),q:[4,10]},{d:R(6,10),q:[5,12]},{d:R(3,10),q:[6,12]}]
};
function cfgAge(op,b){ // faixa 13–16 anos: operandos acima de 6 já na fase 1
  if(age()<2)return b;
  if(op==='add'){const lo=Math.max(7,b.lo);return{lo,hi:Math.max(b.hi,lo+8)}}
  if(op==='sub'){const lo=Math.max(10,b.lo);return{lo,hi:Math.max(b.hi,lo+8),m:7}}
  const big=b[op==='mul'?'t':'d'].filter(x=>x>6),L7=big.length>=3?big:R(7,10);
  if(op==='mul')return{t:L7,f:[Math.max(7,b.f[0]),Math.max(b.f[1],9)]};
  return{d:L7,q:[b.q[0],Math.max(b.q[1],7)]};
}
function cfgFor(op,L){ // jogo infinito: depois da fase 10 começa uma nova volta, mais difícil
  const b=cfgAge(op,OPS[op][L%10]),c=Math.floor(L/10);if(!c)return b;
  const k=1+c*.8;
  if(op==='add'||op==='sub')return{lo:Math.round(b.lo*k),hi:Math.round(b.hi*k),m:b.m};
  if(op==='mul')return{t:[...b.t,...R(11,10+2*c)],f:[b.f[0]+c,b.f[1]+2*c]};
  return{d:[...b.d,...R(11,10+2*c)],q:[b.q[0]+c,b.q[1]+2*c]};
}

/* ============ 3. QUESTÕES ============ */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const GEN={
  add:c=>{const a=rnd(c.lo,c.hi),b=rnd(c.lo,c.hi);return{a,b,ans:a+b,sym:'+'}},
  sub:c=>{const a=rnd(c.lo,c.hi),b=rnd(c.m||1,a-1);return{a,b,ans:a-b,sym:'−'}},
  mul:c=>{let a=pick(c.t),b=rnd(c.f[0],c.f[1]);if(Math.random()<.5)[a,b]=[b,a];return{a,b,ans:a*b,sym:'×'}},
  div:c=>{const b=pick(c.d),q=rnd(c.q[0],c.q[1]);return{a:b*q,b,ans:q,sym:'÷'}}
};
function makeQuestions(mode,L){
  const out=[],seen=new Set();
  for(let i=0;i<QPL;i++){
    let q,n=0,key;
    do{const op=pick(mode.ops);q={op,...GEN[op](cfgFor(op,L))};key=q.op+q.a+'_'+q.b;n++}while(seen.has(key)&&n<40);
    seen.add(key);q.opts=makeOptions(q);out.push(q);
  }
  return out;
}
function makeOptions(q){ // 2 erradas plausíveis, sem repetição
  const {a,b,ans}=q;
  const c={
    add:[ans+1,ans-1,ans+10,ans-10,ans+2,ans-2,Math.abs(a-b)],
    sub:[ans+1,ans-1,ans+10,ans-10,a+b,ans+2,ans-2],
    mul:[ans+a,ans-a,ans+b,ans-b,ans+1,ans-1,a+b],
    div:[ans+1,ans-1,ans+2,ans-2,b,a-b]
  }[q.op].filter(v=>Number.isInteger(v)&&v>0&&v!==ans);
  const wrong=shuffle([...new Set(c)]).slice(0,2);
  for(let k=3;wrong.length<2;k++){const v=ans+k;if(!wrong.includes(v))wrong.push(v)}
  return shuffle([ans,...wrong]);
}

/* ============ 4. REPRESENTAÇÃO VISUAL ============ */
const GC=['#3b82f6','#f97316','#22c55e','#ec4899','#a855f7','#eab308','#14b8a6','#ef4444','#84cc16','#06b6d4','#f43f5e','#8b5cf6'];
const sz=(n,max=24)=>Math.max(6,Math.min(max,Math.floor(Math.sqrt(8000/Math.max(n,1)))-2));
const sqc=(n,s,col)=>`<i class="b" style="--s:${s}px;background:${col}"></i>`.repeat(n);
const sq=(n,cls,s)=>`<i class="b ${cls}" style="--s:${s}px"></i>`.repeat(n);
function bl(n,cls,s){ // grupos de 10 (5×2) com borda + resto tracejado
  const k=Math.floor(n/10),u=n%10;let h='';
  for(let i=0;i<k;i++)h+=`<div class="ten5">${sq(10,cls,s)}</div>`;
  if(u)h+=`<div class="ten5 rest">${sq(u,cls,s)}</div>`;
  return `<div class="bl">${h}</div>`;
}
function vis(q,reveal){
  const {a,b,ans}=q;
  if(q.op==='add'||q.op==='sub'){const s=(a>60||b>60)?10:sz(Math.max(a,b)*2,22);
    return `<div class="eq">${bl(a,'c1',s)}<b>${q.sym}</b>${bl(b,'c2',s)}</div>`}
  if(q.op==='mul'){const s=Math.max(6,Math.min(26,Math.floor(250/b)-2,Math.floor(190/a)-2));let g='';
    for(let r=0;r<a;r++)g+=sqc(b,s,GC[r%12]);
    return `<div class="grid" style="grid-template-columns:repeat(${b},auto)">${g}</div><div class="cap">${t('groupsOf',{a,b})}</div>`}
  const s=sz(a,16);
  const grp=Array.from({length:b},(_,i)=>`<div class="grp" style="border-color:${GC[i%12]}">${sqc(ans,s,GC[i%12])}${reveal?`<em>${ans}</em>`:''}</div>`).join('');
  return `<div class="cap">${t('divCap',{a,b})}</div><div class="groups">${grp}</div>${reveal?`<div class="cap">${t('eachGroup',{n:ans})}</div>`:''}`;
}

/* ============ 5. PERSONAGENS E NARRATIVA ============ */
const DEFAULT=['🐰','🐶','🐱','🐼','🐵','🐸','🐥','🐻'];
const DANGER_GOALS=['🏡','🕳️','🏝️','🌳'],REWARD_GOALS=['🍪','🧸','🍓','🎁','🍭','⚽'];
const MALE0=['🐰','🐶','🐱','🐼','🐵','🐸','🐥','🐻','🦝','🦁','🐧','🐯','🦄']; // 13 + 7 personagens femininas = 20
const PICKS1=['🥷','🦸‍♀️','🦸','🧛‍♀️','🧛','🧟‍♀️','🧟','🧙‍♀️','🐉','🦹‍♀️','🤖','👩‍🚀','👾','🧝‍♀️','🦖','🧙','🦹','🧑‍🚀','🦈','🐺'];
function mix(a,b){const o=[];let i=0,j=0;while(i<a.length||j<b.length){if(i<a.length)o.push(a[i++]);if(j<b.length)o.push(b[j++])}return o}
// 3–8 anos: bichinhos intercalados com personagens femininas (as femininas vêm de names nos JSON)
const picks=()=>age()?PICKS1:mix(MALE0,Object.keys(raw('names')||{}).filter(k=>!MALE0.includes(k)));
const avatar=()=>{const a=(cfg().av||{})[age()];return picks().includes(a)?a:null};
const RADICAL=[{e:'🏃',t:'💣',goal:'🛡️'},{e:'🏃',t:'🧛',goal:'🌅'},{e:'🏃',t:'🧟',goal:'🚁'},{e:'🏃',t:'🌋',goal:'⛵'},{e:'🏊',t:'🦈',goal:'🏝️'},{e:'🧑‍🚀',t:'☄️',goal:'🚀'},{e:'🧙',t:'🐉',goal:'🏰'},{e:'🏃',t:'🌊',goal:'⛰️'}];
function makeScene(){
  if(age()>0){const i=rnd(0,RADICAL.length-1),r=RADICAL[i],d=(raw('radical')||[])[i]||{};
    return{e:avatar()||r.e,n:'',goal:r.goal,threat:r.t,title:d.t,txt:d.x,help:t('helpRad')}}
  const e=avatar()||pick(DEFAULT),n=nameOf(e),help=t('help',{n:n.toLowerCase()});
  if(Math.random()<.5){const i=rnd(0,DANGER_GOALS.length-1);
    return{e,n,goal:DANGER_GOALS[i],title:t('dangerTitle',{e,n}),txt:tl('danger',{n})[i],help}}
  const i=rnd(0,REWARD_GOALS.length-1);
  return{e,n,goal:REWARD_GOALS[i],title:t('rewardTitle',{e,n,txt:tl('reward')[i]}),txt:t('rewardTxt'),help};
}

/* ============ 6. STORAGE + PROGRESSÃO ============ */
const KEY='batalha-tabuada-v1';
const store={ // localStorage; se bloqueado, usa sessionStorage e window.name como reserva
  load(){let r=null;
    try{r=localStorage.getItem(KEY)}catch(e){}
    if(!r)try{r=sessionStorage.getItem(KEY)}catch(e){}
    if(!r&&window.name.indexOf(KEY+'=')===0)r=window.name.slice(KEY.length+1);
    try{const d=JSON.parse(r);return d&&typeof d==='object'?d:{}}catch(e){return{}}},
  save(d){const j=JSON.stringify(d);
    try{localStorage.setItem(KEY,j)}catch(e){}
    try{sessionStorage.setItem(KEY,j)}catch(e){}
    try{window.name=KEY+'='+j}catch(e){}}
};
let SAVE=store.load();
const cfg=()=>SAVE.cfg||(SAVE.cfg={});
const age=()=>cfg().age>=2?2:cfg().age===1?1:0, pk=id=>age()?id+'@'+age():id; // 0=3–8, 1=9–12, 2=13–16
const isFast=()=>!!cfg().fast, soundOn=()=>!cfg().mute, sndIcon=()=>soundOn()?'🔊':'🔇';
function prog(id){
  const k=pk(id);let p=SAVE[k];if(!p||typeof p!=='object')p=SAVE[k]={};
  ['stars','best','combo'].forEach(x=>{if(!Array.isArray(p[x]))p[x]=[]});
  if(!(p.unlocked>=1))p.unlocked=1;
  if(p.stars[9]>0&&p.unlocked<11)p.unlocked=11;
  return p;
}
const sumStars=id=>prog(id).stars.reduce((a,b)=>a+(b||0),0);
const starsFor=ok=>ok>=9?3:ok>=8?2:ok>=PASS?1:0;
function limitFor(m,L){
  const b=Math.max(MIN_TIME,(m.times||TIMES)[L%10]-Math.floor(L/10));
  return isFast()?Math.max(FAST_MIN,Math.round(b*FAST_FACTOR)):b;
}
addEventListener('pagehide',()=>store.save(SAVE));

/* ============ 7. SONS E MÚSICA (sintetizados) ============ */
let AC=null,MG=null,NB=null,hintOn=false;
function getAC(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=1;
      AC.onstatechange=()=>{if(AC&&AC.state==='running'){Music.sync();if(hintOn){hintOn=false;$('toast').classList.remove('on')}}};
      MG.connect(AC.destination);
      NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.1),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
  return AC;
}
function tone(f,s,d,type,v,out){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(out||AC.destination);o.start(s);o.stop(s+d+.03);
}
function beep(f,d,type,v,at){if(!soundOn()||!getAC())return;try{tone(f,AC.currentTime+(at||0),d,type||'sine',v||.15)}catch(e){}}
const SFX={
  click:()=>beep(520,.05,'triangle',.12),
  tick:()=>beep(800,.05,'square',.05),
  tick2:()=>beep(1200,.07,'square',.08),

    :`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-a="ans" data-k="${k}" data-id="${G.qid}">${o}</button>`).join('')}</div>`;
  const qt=`<div class="qt">${q.a} ${q.sym} ${q.b} = ?</div>`,vs=`<div class="vis" id="vis">${vis(q,false)}</div>`,fbh='<div class="fb" id="fb"></div>';
  qb.innerHTML=typed?qt+input+fbh+vs:qt+vs+input+fbh; // digitando: caixa acima do desenho (o teclado não cobre)
  qb.classList.toggle('compact',typed);
  const sc=document.querySelector('.scene');if(sc)sc.style.display=typed?'none':'';
  qb.classList.remove('leave','enter');void qb.offsetWidth;qb.classList.add('enter');
  if(typed){const i=$('ans');i.oninput=()=>{i.value=i.value.replace(/\D/g,'')};i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ACTIONS.send({id:G.qid})}};setTimeout(()=>{try{i.focus({preventScroll:true});i.scrollIntoView({block:'nearest'})}catch(e){}},80)}
  if(!G.train)startTimer();
}
function nextQ(id){
  if(!G||id!==G.qid)return;
  clearTimeout(G.nt);$('qbox').classList.add('leave');
  G.nt=setTimeout(()=>{if(G&&id===G.qid)showQ()},200);
}
function answer(k,val){
  if(!G||G.locked)return;
  G.locked=true;clearInterval(G.iv);
  const q=G.qs[G.i],id=G.qid,timeout=k===null,typed=k===-1,right=!timeout&&(typed?val===q.ans:q.opts[k]===q.ans);
  const spent=G.train?0:Math.min(G.limit,(performance.now()-G.t0)/1000);
  G.times.push(timeout?G.limit:spent);
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ans)b.classList.add('right');else if(j===k)b.classList.add('oops')});
  const inp=$('ans');if(inp){inp.disabled=true;inp.classList.add(right?'okk':'bad');inp.blur()}
  document.querySelectorAll('.typed button').forEach(b=>b.disabled=true);
  if(timeout&&TIMEOUT_LOSES){ // tempo esgotado: pisca vermelho + som + "Você perdeu"
    G.bad++;G.combo=0;updCombo();anim('wig');redFlash();SFX.lose();
    $('fb').textContent=t('timeUp');
    G.nt=setTimeout(()=>{if(G&&id===G.qid){G.lost=true;finish()}},1300);
    return;
  }
  if(right){
    G.ok++;G.combo++;G.max=Math.max(G.max,G.combo);if($('hero'))setPos(G.ok*10);anim('hop');SFX.happy();
    $('fb').textContent=spent<G.limit*.4?t('fastMsg'):G.combo>=2?t('comboMsg'):t('okMsg');
    G.nt=setTimeout(()=>nextQ(id),800);
  }else{
    G.bad++;G.combo=0;anim('wig');SFX.sad();
    const hint=(q.op==='mul'||q.op==='div')?t('hintGroups'):t('hintBlocks');
    $('vis').innerHTML=vis(q,true);
    $('fb').innerHTML=`${timeout?t('timeUp'):t('oops')}<small>${hint}<br>${q.a} ${q.sym} ${q.b} = ${q.ans}</small>`;
    $('bar').innerHTML=`<button class="btn" data-a="cont" data-id="${id}">${t('cont')}</button>`;
    try{$('fb').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
  }
  updCombo();
}
function finish(){
  const d=G;if(d.train)return finishTrain(d);
  clearInterval(d.iv);clearTimeout(d.nt);d.qid++;d.locked=true;
  const stars=d.lost?0:starsFor(d.ok),avg=d.times.reduce((a,b)=>a+b,0)/d.times.length,p=prog(d.mode.id),L=d.lvl,won=!d.lost&&d.ok>=PASS;
  d.stars=stars;d.won=won;
  p.stars[L]=Math.max(p.stars[L]||0,stars);p.best[L]=Math.max(p.best[L]||0,d.ok);p.combo[L]=Math.max(p.combo[L]||0,d.max);
  if(won)p.unlocked=Math.max(p.unlocked,L+2);
  store.save(SAVE);Music.set(won?'win':'fast');document.body.classList.toggle('lost',!won); // fundo mais escuro ao perder
  if(won)SFX.win();else if(!d.lost)SFX.lose();
  const avgTxt=lang()==='en'?avg.toFixed(1):avg.toFixed(1).replace('.',',');
  app.innerHTML=`<div class="card res"><h2>${won?t('win'):d.lost?t('lose'):t('almost')}</h2>${d.lost?`<div class="stat">${t('timeUpAt',{n:d.i+1})}</div>`:''}
  <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.2}s">${i<stars?'⭐':'☆'}</span>`).join('')}</div>
  <div class="stat">${t('hits',{ok:d.ok,n:QPL})}</div><div class="stat">${t('errors',{n:d.bad})}</div>
  <div class="stat">${t('maxCombo',{n:d.max})}</div><div class="stat">${t('avgTime',{n:avgTxt})}</div>
  <div class="stat" style="color:var(--mute);font-size:16px">${t('record',{a:p.best[L],b:p.combo[L]})}</div>
  ${won&&L%10===9?`<div class="stat">${t('lapDone')}</div>`:''}</div>
  ${won?`<button class="btn sh" data-a="share">${t('share')}</button><button class="btn" data-a="nextlvl">${t('next')}</button>${adLink(AD_WIN)}`:''}
  ${won?`<button class="btn alt" data-a="again">${t('again')}</button>`:`<button class="btn big" data-a="again">${t('tryAgain')}</button>`}
  <button class="btn alt" data-a="trail">${t('trail')}</button>
  <button class="btn alt" data-a="home">${t('home')}</button>${won?'':adLink(AD_WIN)}`;
}
async function doShare(txt){ // compartilhar: menu do sistema; senão copia para a área de transferência
  const url=location.href.split('#')[0];
  try{if(navigator.share){await navigator.share({title:t('title'),text:txt,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt+' '+url);toast(t('copied'));return}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=txt+' '+url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(t('copied'))}catch(e){toast(t('shareFail'))}
}
const share=()=>{const d=G;if(d)doShare(t('shareText',{fase:faseTxt(d.lvl).toLowerCase(),mode:t('mode_'+d.mode.id),stars:'⭐'.repeat(d.stars),ok:d.ok,n:QPL,c:d.max}))};
const shareApp=()=>doShare(t('shareAppText'));

/* ============ 10. EVENTOS ============ */
const ACTIONS={
  home,
  avatars:avatarsScreen,
  setav:d=>{cfg().av=cfg().av||{};cfg().av[age()]=d.e;store.save(SAVE);home()},
  age:d=>{cfg().age=+d.v;store.save(SAVE);home()},
  speed:d=>{cfg().fast=d.v==='1';store.save(SAVE);home()},
  lang:d=>{if(!LANGS.includes(d.v))return;cfg().lang=d.v;CUR=d.v;store.save(SAVE);setLangDom();home()}, // idioma escolhido fica salvo
  mute:()=>{cfg().mute=!cfg().mute;store.save(SAVE);document.querySelectorAll('.snd').forEach(b=>b.textContent=sndIcon())},
  mode:d=>levels(d.id),
  cyc:d=>levels(d.m,+d.c),
  lvl:d=>startLevel(d.m,+d.l),
  go:()=>{if(G)begin(G.qid)},
  back:()=>{if(G&&G.train)return trainMenu(G.op);const id=G&&G.mode.id;id?levels(id):home()},
  train:d=>trainMenu(d.op),
  trainstart:d=>startTrain(d.op,+d.n),
  trainnext:()=>startTrain(G.op,G.N+1),
  trainagain:()=>startTrain(G.op,G.N,true),
  trainmenu:()=>trainMenu(G.op),
  traingo:()=>{if(G)beginTrain(G.qid)},
  more:()=>{if(G&&G.intro)G.n+=10},
  send:d=>{if(!G||+d.id!==G.qid||G.locked)return;const i=$('ans');if(!i||i.value==='')return;answer(-1,parseInt(i.value,10))},
  trail:()=>levels(G.mode.id),
  ans:d=>{if(G&&+d.id===G.qid)answer(+d.k)},
  cont:d=>nextQ(+d.id),
  again:()=>startLevel(G.mode.id,G.lvl),
  nextlvl:()=>startLevel(G.mode.id,G.lvl+1),
  share,
  shareapp:shareApp,
  install:installApp
};
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  getAC();if(el.dataset.a!=='ans')SFX.click();
  const f=ACTIONS[el.dataset.a];if(f)f(el.dataset);
  Music.sync();
});
app.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&ACTIONS[el.dataset.change])ACTIONS[el.dataset.change]({v:el.value})});
// o navegador só libera o som após o 1º toque: qualquer toque/tecla destrava e inicia a música
function unlock(){getAC();Music.sync()}
['pointerdown','pointerup','touchstart','touchend','mousedown','click','keydown'].forEach(e=>addEventListener(e,unlock,{capture:true,passive:true}));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const i=$('ans');if(i&&document.activeElement===i)i.scrollIntoView({block:'nearest'})});

/* ============ 11. INÍCIO ============ */
function registerSW(){if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}
function start(){
  setLangDom();getAC();home();registerSW();
  setTimeout(()=>{if(AC&&AC.state!=='running'&&soundOn()){hintOn=true;toast(t('musicHint'),60000)}},500);
}
LANGS.forEach(l=>{LANG[l]=embedded(l)});
start();
</script>
